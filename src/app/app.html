<header class="barra">
  <a class="marca" routerLink="/" aria-label="Fútbol Bogotá, ir al inicio">
    <svg class="marca-icono" viewBox="0 0 32 32" aria-hidden="true">
      <rect x="1" y="3" width="30" height="26" rx="2" fill="none" stroke="currentColor" stroke-width="2" />
      <line x1="16" y1="3" x2="16" y2="29" stroke="currentColor" stroke-width="2" />
      <circle cx="16" cy="16" r="5" fill="none" stroke="currentColor" stroke-width="2" />
    </svg>
    <span class="marca-texto">Fútbol Bogotá</span>
  </a>

  <nav class="acciones" aria-label="Cuenta">
    @if (auth.usuario(); as usuario) {
      <span class="sesion">
        <span class="sesion-nombre">{{ usuario.primerNombre }}</span>
        <span class="sesion-rol">{{ etiquetaRol(usuario.rol) }}</span>
      </span>
      <button type="button" class="enlace" (click)="auth.cerrarSesion()">Cerrar sesión</button>
    } @else {
      <a class="enlace" routerLink="/login">Ingresar</a>
      <a class="boton boton-peto" routerLink="/registro">Crear cuenta</a>
    }
  </nav>
</header>

<main>
  <router-outlet />
</main>
